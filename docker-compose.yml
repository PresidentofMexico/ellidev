version: '3.8'

services:
  elli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elli-slack-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs:rw
    networks:
      - elli-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add monitoring/logging service
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: elli-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   networks:
  #     - elli-network

networks:
  elli-network:
    driver: bridge

volumes:
  prometheus-data:
