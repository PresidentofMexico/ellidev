[pytest]
# Pytest configuration for Elli project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=services
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=45

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end flows
    slow: Tests that take longer to run
    mock: Tests that use mock mode

# Ignore paths
norecursedirs = .git .tox dist build *.egg logs

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
